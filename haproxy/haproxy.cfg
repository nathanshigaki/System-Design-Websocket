global
    log stdout format raw local0 info

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend ws_frontend
    bind *:8080
    mode tcp
    default_backend ws_gateways

backend ws_gateways
    mode tcp
    balance leastconn
    option tcp-check
    default-server init-addr last,libc,none inter 3s fall 2 rise 2
    server gateway-1 gateway-1:4001 check
    server gateway-2 gateway-2:4002 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 3s
    stats show-legends
