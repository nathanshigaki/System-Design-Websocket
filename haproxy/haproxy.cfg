global
    log stdout format raw local0 info

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    retries 3
    option redispatch
    timeout connect 2s
    timeout client 1h
    timeout server 1h

frontend ws_frontend
    bind *:8080
    mode tcp
    default_backend ws_gateways

backend ws_gateways
    mode tcp
    balance leastconn
    retries 3
    option redispatch
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server init-addr last,libc,none inter 1s fastinter 500ms downinter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server gateway-1 gateway-1:4001 check
    server gateway-2 gateway-2:4002 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 3s
    stats show-legends
